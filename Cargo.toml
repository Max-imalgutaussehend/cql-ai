[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Max-imalgutaussehend/cql-ai"
homepage = "https://github.com/Max-imalgutaussehend/cql-ai"
rust-version = "1.95"
keywords = ["cql", "cassandra", "scylla", "machine-learning", "linter"]
categories = ["database", "development-tools", "science"]
authors = ["Max-imalgutaussehend"]

[workspace.dependencies]
cql-ai-model = { path = "crates/cql-ai-model", version = "0.2.0" }
cqlc-core = "1.1"
burn = { version = "0.22", default-features = false, features = ["std", "store", "safetensors"] }
burn-flex = { version = "0.22" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
