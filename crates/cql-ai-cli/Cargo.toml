[package]
name = "cql-ai-cli"
description = "CI linter that predicts CQL performance bottlenecks (large partitions, scatter-gather, tombstones, write cost, hot keys) with a tiny Transformer trained on measured data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "cql-ai"
path = "src/main.rs"

[lib]
name = "cql_ai_cli"
path = "src/lib.rs"

[dependencies]
cql-ai-model = { workspace = true }
burn = { workspace = true, features = ["flex"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ureq = "3"
toml = "0.9"
cqlc-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
